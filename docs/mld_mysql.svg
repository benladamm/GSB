  <!-- Cartouche MLD -->
  <g id="cartouche">
    <rect x="1600" y="950" width="420" height="270" rx="4" fill="#FFFFFF" stroke="#334155" stroke-width="1.5" />
    <text x="1620" y="978" font-size="12" font-weight="bold" fill="#0F172A">SCHEMA RELATIONNEL MYSQL (MLD)</text>
    <line x1="1620" y1="988" x2="2000" y2="988" stroke="#334155" stroke-width="1.2" />
    
    <text x="1620" y="1012" font-size="10.5" fill="#64748B">Base de donnees : <tspan font-weight="bold" fill="#0F172A">gsb_pharmacie</tspan></text>
    <text x="1620" y="1032" font-size="10.5" fill="#64748B">Moteur : <tspan font-weight="bold" fill="#0F172A">InnoDB (MySQL 8.0+ / MariaDB)</tspan></text>
    <text x="1620" y="1052" font-size="10.5" fill="#64748B">Charset : <tspan font-weight="bold" fill="#0F172A">utf8mb4_unicode_ci</tspan></text>
    <text x="1620" y="1072" font-size="10.5" fill="#64748B">Architecture : <tspan font-weight="bold" fill="#0F172A">B2B Multi-fournisseurs</tspan></text>

    <line x1="1620" y1="1092" x2="2000" y2="1092" stroke="#CBD5E1" stroke-width="1" />

    <text x="1620" y="1116" font-size="11" font-weight="bold" fill="#0F172A">CONVENTIONS DU SCHEMA :</text>
    <text x="1620" y="1138" font-size="10.5" fill="#334155">• <u><b>Souligne</b></u> : Cle primaire (PK)</text>
    <text x="1620" y="1158" font-size="10.5" fill="#334155">• <b>#Prefixe</b> : Cle etrangere (FK)</text>
    <text x="1620" y="1178" font-size="10.5" fill="#334155">• Fleche : Relation referentielle FK → PK</text>
    <text x="1620" y="1198" font-size="10.5" fill="#334155">• L'utilisateur commande chez plusieurs laboratoires</text>
  </g>

</svg>